# ══════════════════════════════════════════════════════════════════════════════
#  THE PULL TEST
#
#  The one manifest this lab needs. nginx:alpine has no dependencies, no config
#  and no secrets, so if this pod reaches Running then the registry, the CA, the
#  node's containerd trust store and the image reference are all proven in a
#  single step. Nothing else is on the causal path.
#
#  ── THE TWO LINES UNDER TEST ────────────────────────────────────────────────
#
#      image: host.docker.internal:5001/regis-nginx:alpine
#      imagePullPolicy: Always
#
#  1. host.docker.internal, NOT localhost. The kubelet runs inside a node
#     container, so "localhost" there is the NODE ITSELF — nothing is listening
#     on that port in there. host.docker.internal is Docker's embedded DNS name
#     for the VM gateway, and the host's published port lands back on this
#     registry. The same name keys the certificate SAN, the certs.d directory
#     and hosts.toml:
#         SAN          DNS.3 = host.docker.internal
#         certs.d dir  /etc/containerd/certs.d/host.docker.internal:5001
#         hosts.toml   server = "https://host.docker.internal:5001"
#     All four are rendered from REGISTRY_AUTHORITY in the Makefile, so they
#     cannot disagree — which is the only reason this works.
#
#  2. imagePullPolicy: Always is load-bearing, not decoration. The default is
#     IfNotPresent, and after one successful pull the image is already in the
#     node's containerd — so IfNotPresent would satisfy the pull from local
#     cache, the registry would never be contacted, the CA injection would go
#     completely untested, and the pod would still start green. Always forces a
#     round-trip every time, which is the only way this measures what it claims.
#
#  ── A NOTE ON TRUST ────────────────────────────────────────────────────────
#  The registry uses a certificate we minted ourselves. A pull succeeds only if
#  BOTH hold:
#
#     (a) the CA that signed the leaf is in the store containerd consults
#     (b) the name the kubelet dials is in that certificate's subjectAltName
#
#  (a) is what `make k8s` establishes. (b) is what the SAN list establishes.
#  Failing (a) gives:  x509: certificate signed by unknown authority
#  Failing (b) gives:  x509: certificate is valid for localhost, not host.docker.internal
#
#  hosts.toml sets skip_verify = false, so BOTH are enforced at handshake time.
#  That is deliberate: with verification off, a green pull would prove only
#  that the path is reachable — not that the node actually trusts this registry.
# ══════════════════════════════════════════════════════════════════════════════
---
apiVersion: v1
kind: Namespace
metadata:
  name: regis-pull
  labels:
    lab.local/simulation: "true"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: regis-pull
  labels:
    app: nginx
    lab.local/simulation: "true"
spec:
  # 1 replica. The question is "can a node pull this", not "can the scheduler
  # spread it", and a single pod keeps the evidence unambiguous: one node, one
  # pull, one log to read.
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  strategy:
    # Recreate, not RollingUpdate — with 1 replica and no Service there is
    # nothing to roll, and Recreate gives one clean start rather than a surge.
    type: Recreate
  template:
    metadata:
      labels:
        app: nginx
        lab.local/simulation: "true"
    spec:
      # Deliberately NO nodeSelector. The real question is whether EVERY node
      # can pull, and pinning to one worker would hide a partially-patched
      # cluster. `make verify-nodes` checks all four; this checks that the
      # scheduler's chosen node can pull.
      containers:
        - name: nginx
          # ↓↓↓ THE LINE UNDER TEST ↓↓↓
          image: host.docker.internal:5001/regis-nginx:alpine
          # ↑↑↑ port rewritten from .env by `make app` ↑↑↑

          # See point 2 in the header. Required for the test to mean anything.
          imagePullPolicy: Always

          env:
            # Downward API, so the pod log names the node that actually pulled
            # the image. That is the per-node evidence: if two different nodes
            # can be made to run this, both are proven.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP

          ports:
            - name: http
              containerPort: 80

          # A Running nginx is the assertion. Without a probe, "Running" only
          # means the container started, which is already the proof we want
          # here — but a probe makes the pod genuinely Ready, which makes
          # `kubectl get pods` a one-glance answer instead of a judgement call.
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20

          # Generous, because a first pull fetches every layer over TLS from a
          # self-signed registry. Too short and the pod is killed mid-pull,
          # which looks like an image problem and is not one.
          #
          # NOTE: terminationGracePeriodSeconds is a PodSpec field, not a
          # container field — placed inside `containers[]` the API server
          # rejects the whole manifest with a strict-decoding error naming the
          # misplaced path. Set at pod level below.
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi

          # NO securityContext hardening here, deliberately.
          #
          # nginx:alpine's master process binds :80, and binding a privileged
          # port requires CAP_NET_BIND_SERVICE. An earlier draft of this file
          # set `capabilities: {drop: [ALL]}` and `runAsNonRoot`, which is the
          # correct hardening for a real workload and an immediate
          # containerdCrashLoopBackOff here — the image would pull perfectly
          # and then die, and the failure would read as a registry problem.
          #
          # For the same reason there is no runAsUser: nginx:alpine's entrypoint
          # writes to /var/cache/nginx and /etc/nginx as root.
          #
          # The subject of this manifest is the PULL, not the security posture.
          # If you want a hardened variant, the image has to change too — e.g.
          # an unprivileged base, or an nginx.conf listening on 8080 — because
          # hardening the pod while keeping a :80-binding image cannot work.

      # Generous shutdown budget, at PodSpec level (see note above).
      terminationGracePeriodSeconds: 30
