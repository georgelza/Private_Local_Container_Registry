# ══════════════════════════════════════════════════════════════════════════════
#  LOCAL TLS REGISTRY + UI
#
#  The registry serves every image the vCluster nodes pull, over HTTPS, with a
#  certificate we minted ourselves. Node kubelets reach it on the Docker gateway
#  name (host.docker.internal:$(HOST_PORT_REGISTRY)) — not localhost, because
#  inside a node container "localhost" is the node itself.
#
#  The CA is given to the CLIENTS (the nodes, and the docker daemon for push).
#  The registry is handed only the leaf: /certs/server.{crt,key}, read-only. It
#  presents and waits; trusting is someone else's job.
# ══════════════════════════════════════════════════════════════════════════════

name: regis
services:
  # ══════════════════════════════════════════════════════════════════════════
  # THE REGISTRY
  # vCluster kubelets pull every image from here, on the Docker gateway name —
  # node containers resolve host.docker.internal to the Docker Desktop host, and
  # its published port lands back here.
  #
  # Blobs live in ./data/registry, which `make down` wipes. That directory also
  # holds certs/, mounted read-only below; nothing else may depend on it.
  # ══════════════════════════════════════════════════════════════════════════
  regis_registry:
    image: ${REGISTRY_IMAGE:-registry:2}
    container_name: regis-registry
    hostname: regis-registry
    ports:
      - ${HOST_PORT_REGISTRY:-5001}:5000
    volumes:
      - ./data/registry:/var/lib/registry
      - ./data/registry/certs:/certs:ro
    environment:
      # Without this, registry:2 refuses DELETE /v2/<name>/manifests/<digest>,
      # which breaks the UI's delete controls and scripts/purge_registry.sh.
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
      # TLS — the registry presents and waits. It is handed the leaf only; the
      # CA goes to the clients (the nodes, and the docker daemon for push).
      REGISTRY_HTTP_TLS_CERTIFICATE: /certs/server.crt
      REGISTRY_HTTP_TLS_KEY: /certs/server.key
    healthcheck:
      # wget, NOT curl: the registry:2 image ships no curl (only busybox wget), so a
      # curl probe fails 127 -> "|| exit 1" -> Docker marks the container unhealthy
      # while the registry is serving 200 perfectly well. This is a real trap:
      # the container is only *marked* bad, the UI still works, and the red
      # status misleads you into chasing a registry that is perfectly healthy.
      # --no-check-certificate is required: the registry serves HTTPS using the local
      # self-signed CA from ./data/registry/certs.
      test: ["CMD-SHELL", "wget --no-check-certificate -q -O /dev/null https://localhost:5000/v2/_catalog || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  regis_registry_ui:
    image: ${REGISTRY_UI_IMAGE:-joxit/docker-registry-ui:latest} 
    container_name: regis-registry-ui
    hostname: regis-registry-ui
    depends_on:
      regis_registry:
        condition: service_started
    ports:
      - ${HOST_PORT_REGISTRY_UI:-8080}:80
    environment:
      # Same-origin proxy: the UI container's nginx proxies /v2/* to the
      # registry, so the browser talks to this one origin only (no CORS).
      # The registry serves TLS, so this hop is https. Verification is off HERE
      # only — the UI and the browser are not part of the trust chain the kubelet
      # depends on. The node-side store is verified (skip_verify = false).
      NGINX_PROXY_PASS_URL: https://regis-registry:5000
      NGINX_PROXY_SSL_VERIFY: "off"
      # Baked into index.html as the registry-url attribute — must be a URL
      # the BROWSER can reach (this UI's own origin), not the container DNS.
      REGISTRY_URL: http://localhost:${HOST_PORT_REGISTRY_UI:-8080}
      SINGLE_REGISTRY: "true"
      # Enables the per-tag + multi-select delete controls in the UI.
      DELETE_IMAGES: "true"

networks:
  default:
    name: regis
