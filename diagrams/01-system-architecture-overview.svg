<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="dockerCard1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="vclusterCard1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#172554" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <filter id="glow1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="960" height="540" fill="url(#bg1)" rx="16" />

  <!-- Outer Machine Frame -->
  <rect x="30" y="30" width="900" height="480" rx="12" fill="none" stroke="#334155" stroke-width="2" />
  <rect x="50" y="45" width="200" height="30" rx="6" fill="#334155" />
  <text x="150" y="65" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">YOUR MACHINE</text>

  <!-- Docker Compose Box -->
  <rect x="60" y="100" width="380" height="380" rx="10" fill="url(#dockerCard1)" stroke="#0284c7" stroke-width="2" />
  <rect x="80" y="115" width="180" height="26" rx="4" fill="#0284c7" />
  <text x="170" y="132" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">docker compose</text>

  <!-- Registry Service -->
  <rect x="90" y="165" width="320" height="120" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
  <text x="110" y="195" fill="#38bdf8" font-family="sans-serif" font-size="16" font-weight="bold">regis-registry</text>
  <text x="110" y="220" fill="#94a3b8" font-family="sans-serif" font-size="13">Serves Images via HTTPS</text>
  <rect x="110" y="235" width="180" height="24" rx="4" fill="#0369a1" />
  <text x="200" y="251" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Self-Signed Certificate</text>

  <!-- Registry UI Service -->
  <rect x="90" y="310" width="320" height="140" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1.5" />
  <text x="110" y="340" fill="#f8fafc" font-family="sans-serif" font-size="16" font-weight="bold">regis-registry-ui</text>
  <text x="110" y="365" fill="#94a3b8" font-family="sans-serif" font-size="13">Web Interface for Registry</text>

  <!-- vCluster Box -->
  <rect x="520" y="100" width="380" height="380" rx="10" fill="url(#vclusterCard1)" stroke="#3b82f6" stroke-width="2" />
  <rect x="540" y="115" width="220" height="26" rx="4" fill="#2563eb" />
  <text x="650" y="132" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">vcluster (my-regis1)</text>

  <!-- Control Plane & Worker Nodes -->
  <rect x="550" y="160" width="320" height="50" rx="6" fill="#1e293b" stroke="#60a5fa" stroke-width="1" />
  <text x="710" y="190" fill="#93c5fd" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">vcluster.cp.my-regis1 (Control Plane)</text>

  <g fill="#1e293b" stroke="#3b82f6" stroke-width="1">
    <rect x="550" y="230" width="320" height="55" rx="6" />
    <rect x="550" y="295" width="320" height="55" rx="6" />
    <rect x="550" y="360" width="320" height="55" rx="6" />
  </g>
  <text x="710" y="263" fill="#f8fafc" font-family="sans-serif" font-size="12" text-anchor="middle">vcluster.node.my-regis1.worker-1</text>
  <text x="710" y="328" fill="#f8fafc" font-family="sans-serif" font-size="12" text-anchor="middle">vcluster.node.my-regis1.worker-2</text>
  <text x="710" y="393" fill="#f8fafc" font-family="sans-serif" font-size="12" text-anchor="middle">vcluster.node.my-regis1.worker-3</text>

  <!-- Traffic Connector -->
  <path d="M 550 295 C 470 295, 470 225, 410 225" fill="none" stroke="#22c55e" stroke-width="3" stroke-dasharray="6,6" filter="url(#glow1)" />
  <polygon points="412,220 400,225 412,230" fill="#22c55e" />

  <rect x="410" y="250" width="130" height="48" rx="6" fill="#0f172a" stroke="#22c55e" stroke-width="1" />
  <text x="475" y="268" fill="#22c55e" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">pulls images</text>
  <text x="475" y="286" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">HTTPS :5001</text>
</svg>
