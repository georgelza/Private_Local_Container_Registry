<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="100%" height="100%">
  <defs>
    <linearGradient id="bg6a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
  </defs>

  <rect width="960" height="620" fill="url(#bg6a)" rx="16" />

  <text x="480" y="32" fill="#e2e8f0" font-family="sans-serif" font-size="17" font-weight="bold" text-anchor="middle">Chain of Custody — from an openssl command to a running container</text>

  <!-- ① Certificate generation -->
  <rect x="40" y="50" width="430" height="260" rx="10" fill="#1e293b" stroke="#818cf8" stroke-width="2" />
  <text x="60" y="76" fill="#a5b4fc" font-family="sans-serif" font-size="15" font-weight="bold">① make certs — openssl, on the host</text>

  <rect x="60" y="92" width="140" height="40" rx="6" fill="#0f172a" stroke="#6366f1" />
  <text x="130" y="117" fill="#e0e7ff" font-family="monospace" font-size="10" text-anchor="middle">ca.key (CA key)</text>

  <text x="240" y="117" fill="#818cf8" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">signs →</text>

  <rect x="290" y="92" width="140" height="40" rx="6" fill="#0f172a" stroke="#6366f1" />
  <text x="360" y="117" fill="#e0e7ff" font-family="monospace" font-size="10" text-anchor="middle">ca.crt 730d</text>

  <text x="360" y="152" fill="#818cf8" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">▼ signs</text>

  <rect x="270" y="162" width="180" height="40" rx="6" fill="#0f172a" stroke="#6366f1" />
  <text x="360" y="187" fill="#e0e7ff" font-family="monospace" font-size="10" text-anchor="middle">server.crt (leaf, 2d)</text>

  <rect x="60" y="216" width="390" height="78" rx="6" fill="#0f172a" stroke="#4338ca" />
  <text x="76" y="238" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="bold">SAN</text>
  <text x="76" y="260" fill="#a5b4fc" font-family="monospace" font-size="10">localhost</text>
  <text x="200" y="260" fill="#94a3b8" font-family="monospace" font-size="10">regis-registry</text>
  <text x="76" y="282" fill="#34d399" font-family="monospace" font-size="10">host.docker.internal ★</text>
  <text x="300" y="282" fill="#94a3b8" font-family="monospace" font-size="10">127.0.0.1</text>

  <!-- ② Compose mounts -->
  <rect x="490" y="50" width="430" height="260" rx="10" fill="#1e293b" stroke="#0284c7" stroke-width="2" />
  <text x="510" y="76" fill="#38bdf8" font-family="sans-serif" font-size="15" font-weight="bold">② compose mounts — serves HTTPS on :5000</text>

  <rect x="510" y="92" width="390" height="96" rx="6" fill="#0f172a" stroke="#0369a1" />
  <text x="530" y="118" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="bold">regis-registry container</text>
  <text x="530" y="143" fill="#94a3b8" font-family="monospace" font-size="11">/certs/server.crt</text>
  <text x="530" y="163" fill="#94a3b8" font-family="monospace" font-size="11">/certs/server.key</text>
  <text x="690" y="163" fill="#38bdf8" font-family="monospace" font-size="10">read-only bind mount</text>

  <rect x="510" y="200" width="390" height="44" rx="6" fill="#0f172a" stroke="#0369a1" />
  <text x="705" y="218" fill="#f87171" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">The CA is NOT given to the registry</text>
  <text x="705" y="236" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">only to the clients — it presents and waits</text>

  <rect x="510" y="256" width="390" height="38" rx="6" fill="#0f172a" stroke="#0369a1" />
  <text x="705" y="280" fill="#7dd3fc" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">leaf only · trust is the client's job</text>

  <!-- ③ Node injection -->
  <rect x="40" y="330" width="430" height="250" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="2" />
  <text x="60" y="356" fill="#34d399" font-family="sans-serif" font-size="15" font-weight="bold">③ make k8s step 2 — into each node</text>

  <rect x="60" y="372" width="390" height="196" rx="6" fill="#0f172a" stroke="#059669" />
  <text x="78" y="394" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="bold">docker cp + exec, per node container</text>

  <text x="78" y="418" fill="#34d399" font-family="monospace" font-size="10">/etc/containerd/certs.d/</text>
  <text x="94" y="434" fill="#a7f3d0" font-family="monospace" font-size="10">└─ host.docker.internal:5001/</text>
  <text x="110" y="450" fill="#a7f3d0" font-family="monospace" font-size="10">├─ ca.crt</text>
  <text x="110" y="466" fill="#a7f3d0" font-family="monospace" font-size="10">└─ hosts.toml</text>

  <text x="78" y="490" fill="#34d399" font-family="monospace" font-size="10">config_path = "/etc/containerd/certs.d"</text>

  <text x="78" y="512" fill="#34d399" font-family="monospace" font-size="10">/usr/local/share/ca-certificates/</text>
  <text x="94" y="528" fill="#a7f3d0" font-family="monospace" font-size="10">└─ registry-ca.crt</text>

  <rect x="78" y="536" width="212" height="24" rx="4" fill="#059669" />
  <text x="184" y="553" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">systemctl restart containerd</text>
  <text x="300" y="553" fill="#fcd34d" font-family="sans-serif" font-size="10">then wait for it</text>

  <!-- ④ The pull -->
  <rect x="490" y="330" width="430" height="250" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="2" />
  <text x="510" y="356" fill="#fbbf24" font-family="sans-serif" font-size="15" font-weight="bold">④ the kubelet pulls — CRI → containerd → HTTPS</text>

  <rect x="510" y="372" width="390" height="88" rx="6" fill="#0f172a" stroke="#b45309" />
  <text x="530" y="398" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="bold">image: host.docker.internal:5001/regis-nginx:alpine</text>
  <text x="530" y="422" fill="#94a3b8" font-family="monospace" font-size="11">the CA is in place</text>
  <text x="530" y="442" fill="#94a3b8" font-family="monospace" font-size="11">the dialled name is in the SAN</text>

  <rect x="510" y="474" width="390" height="46" rx="6" fill="#0f172a" stroke="#b45309" />
  <text x="705" y="494" fill="#34d399" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">pull succeeds — the container runs</text>
  <text x="705" y="512" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">this is the assertion the whole lab exists for</text>

  <rect x="510" y="532" width="390" height="28" rx="4" fill="#78350f" />
  <text x="705" y="551" fill="#fde68a" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">imagePullPolicy: Always — or the cache would fake it</text>
</svg>