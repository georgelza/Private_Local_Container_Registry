<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg7a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
  </defs>

  <rect width="960" height="520" fill="url(#bg7a)" rx="16" />

  <rect x="40" y="40" width="880" height="110" rx="10" fill="#1e293b" stroke="#818cf8" stroke-width="2" />
  <text x="60" y="70" fill="#a5b4fc" font-family="sans-serif" font-size="15" font-weight="bold">① Certificate Generation (OpenSSL on Host)</text>
  
  <rect x="60" y="85" width="220" height="45" rx="6" fill="#0f172a" stroke="#6366f1" />
  <text x="80" y="112" fill="#e0e7ff" font-family="monospace" font-size="12">ca.crt (CA Root, 730d)</text>

  <text x="315" y="112" fill="#818cf8" font-family="sans-serif" font-size="18" font-weight="bold">→</text>

  <rect x="340" y="85" width="560" height="45" rx="6" fill="#0f172a" stroke="#6366f1" />
  <text x="360" y="112" fill="#e0e7ff" font-family="monospace" font-size="11">server.crt (Leaf, 2d) | SAN: localhost, regis-registry, host.docker.internal</text>

  <rect x="40" y="180" width="410" height="290" rx="10" fill="#1e293b" stroke="#0284c7" stroke-width="2" />
  <text x="60" y="210" fill="#38bdf8" font-family="sans-serif" font-size="15" font-weight="bold">② Docker Compose Registry Mount</text>

  <rect x="60" y="250" width="370" height="190" rx="8" fill="#0f172a" stroke="#0369a1" />
  <text x="80" y="280" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="bold">regis-registry container</text>
  <text x="80" y="310" fill="#94a3b8" font-family="monospace" font-size="11">/certs/server.crt (Read-Only Mount)</text>
  <text x="80" y="330" fill="#94a3b8" font-family="monospace" font-size="11">/certs/server.key (Read-Only Mount)</text>
  <rect x="80" y="360" width="220" height="30" rx="4" fill="#0284c7" />
  <text x="190" y="380" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Serves HTTPS on :5001</text>

  <rect x="510" y="180" width="410" height="290" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="2" />
  <text x="530" y="210" fill="#34d399" font-family="sans-serif" font-size="15" font-weight="bold">③ vCluster Node Ingestion</text>

  <rect x="530" y="250" width="370" height="190" rx="8" fill="#0f172a" stroke="#059669" />
  <text x="550" y="280" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="bold">vcluster.node.my-regis1.* Workers</text>
  <text x="550" y="310" fill="#34d399" font-family="monospace" font-size="11">/etc/containerd/certs.d/</text>
  <text x="570" y="330" fill="#34d399" font-family="monospace" font-size="11">└── host.docker.internal:5001/</text>
  <text x="590" y="350" fill="#a7f3d0" font-family="monospace" font-size="11">├── ca.crt &amp; hosts.toml</text>
  <text x="550" y="380" fill="#34d399" font-family="monospace" font-size="11">/usr/local/share/ca-certificates/</text>
</svg>
