<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="100%" height="100%">
  <defs>
    <linearGradient id="bg9" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#27272a" />
    </linearGradient>
  </defs>

  <rect width="960" height="440" fill="url(#bg9)" rx="16" />

  <!-- Step 1: make down -->
  <rect x="30" y="35" width="270" height="370" rx="10" fill="#18181b" stroke="#ef4444" stroke-width="2" />
  <text x="45" y="68" fill="#ef4444" font-family="sans-serif" font-size="15" font-weight="bold">1. make down</text>
  <text x="45" y="95" fill="#f87171" font-family="monospace" font-size="11">rm -rf ./data/registry</text>

  <rect x="45" y="120" width="240" height="260" rx="6" fill="#27272a" />
  <text x="60" y="150" fill="#f87171" font-family="sans-serif" font-size="13" font-weight="bold">Deletes ca.key!</text>
  <text x="60" y="178" fill="#a1a1aa" font-family="sans-serif" font-size="11">The ONLY copy of the CA</text>
  <text x="60" y="196" fill="#a1a1aa" font-family="sans-serif" font-size="11">private key in existence</text>
  <text x="60" y="214" fill="#a1a1aa" font-family="sans-serif" font-size="11">is permanently wiped.</text>
  <text x="60" y="250" fill="#f87171" font-family="sans-serif" font-size="11" font-weight="bold">Nodes still retain old</text>
  <text x="60" y="268" fill="#f87171" font-family="sans-serif" font-size="11" font-weight="bold">public ca.crt in certs.d</text>

  <!-- Arrow 1 -> 2 -->
  <path d="M 300 220 L 330 220" stroke="#ef4444" stroke-width="2.5" />

  <!-- Step 2: make run -->
  <rect x="330" y="35" width="270" height="370" rx="10" fill="#18181b" stroke="#f59e0b" stroke-width="2" />
  <text x="345" y="68" fill="#f59e0b" font-family="sans-serif" font-size="15" font-weight="bold">2. make run</text>
  <text x="345" y="95" fill="#fbbf24" font-family="monospace" font-size="11">Mints BRAND NEW CA</text>

  <rect x="345" y="120" width="240" height="260" rx="6" fill="#27272a" />
  <text x="360" y="150" fill="#fbbf24" font-family="sans-serif" font-size="13" font-weight="bold">New Certificate Served</text>
  <text x="360" y="178" fill="#a1a1aa" font-family="sans-serif" font-size="11">Registry now serves leaf</text>
  <text x="360" y="196" fill="#a1a1aa" font-family="sans-serif" font-size="11">signed by new CA key.</text>
  <text x="360" y="235" fill="#ef4444" font-family="sans-serif" font-size="11" font-weight="bold">FINDING 8 WINDOW:</text>
  <text x="360" y="255" fill="#ef4444" font-family="sans-serif" font-size="11" font-weight="bold">Cluster standing across</text>
  <text x="360" y="275" fill="#ef4444" font-family="sans-serif" font-size="11" font-weight="bold">boundary holds old CA</text>

  <!-- Arrow 2 -> 3 -->
  <path d="M 600 220 L 630 220" stroke="#ef4444" stroke-width="2.5" />

  <!-- Step 3: Result (Finding 8) -->
  <rect x="630" y="35" width="300" height="370" rx="10" fill="#450a0a" stroke="#ef4444" stroke-width="2" />
  <text x="645" y="68" fill="#fca5a5" font-family="sans-serif" font-size="15" font-weight="bold">3. Result (Finding 8)</text>

  <rect x="645" y="120" width="270" height="260" rx="6" fill="#7f1d1d" />
  <text x="660" y="150" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">PREVENTED BY MAKE APP</text>
  
  <rect x="660" y="165" width="240" height="50" rx="4" fill="#450a0a" />
  <text x="670" y="185" fill="#fca5a5" font-family="monospace" font-size="9.5">ERROR: a node does not</text>
  <text x="670" y="202" fill="#fca5a5" font-family="monospace" font-size="9.5">trust current CA</text>

  <text x="660" y="240" fill="#fca5a5" font-family="sans-serif" font-size="11">`make app` verifies node</text>
  <text x="660" y="260" fill="#fca5a5" font-family="sans-serif" font-size="11">handshake before deploy,</text>
  <text x="660" y="280" fill="#fca5a5" font-family="sans-serif" font-size="11">blocking execution.</text>
  <text x="660" y="310" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold">Fix: run `make patch-nodes`</text>
</svg>
