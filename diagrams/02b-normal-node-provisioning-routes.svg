<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1f2937" />
    </linearGradient>
  </defs>

  <rect width="960" height="380" fill="url(#bg2b)" rx="16" />

  <rect x="40" y="30" width="880" height="320" rx="10" fill="#1e293b" stroke="#475569" stroke-width="2" />
  <text x="70" y="65" fill="#f8fafc" font-family="sans-serif" font-size="16" font-weight="bold">Standard Production K8s Node CA Provisioning</text>

  <rect x="70" y="90" width="380" height="230" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
  <text x="90" y="120" fill="#38bdf8" font-family="monospace" font-size="13">/etc/containerd/certs.d/</text>
  <text x="110" y="145" fill="#94a3b8" font-family="monospace" font-size="12">└── registry.example.com/</text>
  <text x="130" y="170" fill="#34d399" font-family="monospace" font-size="12">├── ca.crt</text>
  <text x="130" y="195" fill="#34d399" font-family="monospace" font-size="12">└── hosts.toml</text>
  <text x="90" y="240" fill="#f8fafc" font-family="monospace" font-size="12">config_path = "/etc/containerd/certs.d"</text>
  <text x="90" y="275" fill="#64748b" font-family="sans-serif" font-size="11">containerd reads this configuration at startup</text>

  <g font-family="sans-serif" font-size="13">
    <rect x="500" y="90" width="390" height="60" rx="6" fill="#1e293b" stroke="#3b82f6" />
    <text x="520" y="115" fill="#93c5fd" font-weight="bold">1. Node Image (AMI)</text>
    <text x="520" y="135" fill="#94a3b8" font-size="11">Bake CA certificates directly into base OS image</text>

    <rect x="500" y="175" width="390" height="60" rx="6" fill="#1e293b" stroke="#3b82f6" />
    <text x="520" y="200" fill="#93c5fd" font-weight="bold">2. Configuration Management</text>
    <text x="520" y="220" fill="#94a3b8" font-size="11">Ansible / Cloud-init writes cert files at boot time</text>

    <rect x="500" y="260" width="390" height="60" rx="6" fill="#1e293b" stroke="#3b82f6" />
    <text x="520" y="285" fill="#93c5fd" font-weight="bold">3. Privileged DaemonSet</text>
    <text x="520" y="305" fill="#94a3b8" font-size="11">Mounts host filesystem to copy trust files</text>
  </g>
</svg>
