<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#27272a" />
    </linearGradient>
  </defs>

  <rect width="960" height="480" fill="url(#bg3)" rx="16" />

  <rect x="40" y="40" width="400" height="400" rx="10" fill="#09090b" stroke="#a855f7" stroke-width="2" />
  <text x="60" y="75" fill="#c084fc" font-family="sans-serif" font-size="16" font-weight="bold">HOST CLI / SCRIPT INJECTION</text>

  <g font-family="monospace" font-size="11" fill="#e4e4e7">
    <rect x="60" y="100" width="360" height="48" rx="6" fill="#18181b" stroke="#3f3f46" />
    <text x="75" y="120" fill="#a855f7" font-weight="bold">STEP 1:</text>
    <text x="130" y="120">docker exec &lt;node&gt; mkdir -p</text>
    <text x="130" y="135" fill="#71717a">/etc/containerd/certs.d/...</text>

    <rect x="60" y="160" width="360" height="48" rx="6" fill="#18181b" stroke="#3f3f46" />
    <text x="75" y="180" fill="#a855f7" font-weight="bold">STEP 2:</text>
    <text x="130" y="180">docker cp ca.crt &lt;node&gt;:...</text>

    <rect x="60" y="220" width="360" height="48" rx="6" fill="#18181b" stroke="#3f3f46" />
    <text x="75" y="240" fill="#a855f7" font-weight="bold">STEP 3:</text>
    <text x="130" y="240">docker cp hosts.toml &lt;node&gt;:...</text>

    <rect x="60" y="280" width="360" height="48" rx="6" fill="#18181b" stroke="#3f3f46" />
    <text x="75" y="300" fill="#a855f7" font-weight="bold">STEP 4:</text>
    <text x="130" y="300">docker exec sed config_path...</text>

    <rect x="60" y="340" width="360" height="48" rx="6" fill="#18181b" stroke="#10b981" stroke-width="1.5" />
    <text x="75" y="360" fill="#10b981" font-weight="bold">STEP 5:</text>
    <text x="130" y="360">docker exec systemctl restart</text>
    <text x="130" y="375" fill="#34d399">(Finding 3 fix: restart + wait)</text>
  </g>

  <path d="M 450 240 L 510 240" stroke="#c084fc" stroke-width="3" />
  <polygon points="505,233 520,240 505,247" fill="#c084fc" />

  <rect x="530" y="40" width="390" height="400" rx="10" fill="#09090b" stroke="#3b82f6" stroke-width="2" />
  <text x="550" y="75" fill="#60a5fa" font-family="sans-serif" font-size="16" font-weight="bold">VCLUSTER NODE CONTAINERS</text>
  <text x="550" y="95" fill="#71717a" font-family="sans-serif" font-size="12">Modifies container's writable layer directly</text>

  <g fill="#18181b" stroke="#38bdf8" stroke-width="1">
    <rect x="550" y="125" width="350" height="85" rx="6" />
    <rect x="550" y="225" width="350" height="85" rx="6" />
    <rect x="550" y="325" width="350" height="85" rx="6" />
  </g>
  <text x="570" y="150" fill="#f4f4f5" font-family="sans-serif" font-size="12" font-weight="bold">vcluster.node.my-regis1.worker-1</text>
  <text x="570" y="170" fill="#a1a1aa" font-family="monospace" font-size="11">└── /etc/containerd/certs.d/ [Patched]</text>

  <text x="570" y="250" fill="#f4f4f5" font-family="sans-serif" font-size="12" font-weight="bold">vcluster.node.my-regis1.worker-2</text>
  <text x="570" y="270" fill="#a1a1aa" font-family="monospace" font-size="11">└── /etc/containerd/certs.d/ [Patched]</text>

  <text x="570" y="350" fill="#f4f4f5" font-family="sans-serif" font-size="12" font-weight="bold">vcluster.node.my-regis1.worker-3</text>
  <text x="570" y="370" fill="#a1a1aa" font-family="monospace" font-size="11">└── /etc/containerd/certs.d/ [Patched]</text>
</svg>
