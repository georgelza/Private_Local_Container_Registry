<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bg7b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <rect width="960" height="420" fill="url(#bg7b)" rx="16" />

  <rect x="40" y="30" width="880" height="360" rx="12" fill="none" stroke="#64748b" stroke-width="2" />
  <text x="60" y="60" fill="#f8fafc" font-family="sans-serif" font-size="16" font-weight="bold">HOST vs. DOCKER VM RESOLUTION PATHS</text>

  <rect x="80" y="100" width="380" height="110" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
  <text x="100" y="130" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="bold">Host-Side Tools (curl, browser)</text>
  <text x="100" y="160" fill="#e2e8f0" font-family="monospace" font-size="12">https://localhost:5001</text>
  <text x="100" y="185" fill="#94a3b8" font-family="sans-serif" font-size="11">Connects directly to published Docker port</text>

  <rect x="80" y="240" width="800" height="120" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="2" />
  <text x="100" y="265" fill="#60a5fa" font-family="sans-serif" font-size="14" font-weight="bold">Inside Docker Desktop VM / Node Container</text>
  <text x="100" y="295" fill="#ef4444" font-family="monospace" font-size="12">localhost:5001 ──► Fails (Points inside container itself)</text>
  <text x="100" y="325" fill="#34d399" font-family="monospace" font-size="12">host.docker.internal:5001 ──► VM Gateway ──► Host Port 5001 ✅</text>
</svg>
