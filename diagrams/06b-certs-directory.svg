<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg6b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
  </defs>

  <rect width="960" height="520" fill="url(#bg6b)" rx="16" />

  <text x="480" y="34" fill="#e2e8f0" font-family="sans-serif" font-size="17" font-weight="bold" text-anchor="middle">What data/registry/certs/ holds</text>
  <text x="480" y="54" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">generated on every make run · never committed — it contains the CA private key</text>

  <!-- root -->
  <rect x="40" y="72" width="300" height="36" rx="6" fill="#0f172a" stroke="#6366f1" />
  <text x="60" y="95" fill="#e0e7ff" font-family="monospace" font-size="12">data/registry/certs/</text>

  <text x="360" y="95" fill="#818cf8" font-family="sans-serif" font-size="18" font-weight="bold">│</text>
  <text x="378" y="95" fill="#94a3b8" font-family="sans-serif" font-size="11">everything below is disposable and rebuilt by make certs</text>

  <!-- column headers -->
  <rect x="40" y="126" width="230" height="26" rx="4" fill="#1e1b4b" />
  <text x="54" y="144" fill="#a5b4fc" font-family="sans-serif" font-size="11" font-weight="bold">FILE</text>
  <rect x="276" y="126" width="230" height="26" rx="4" fill="#1e1b4b" />
  <text x="290" y="144" fill="#a5b4fc" font-family="sans-serif" font-size="11" font-weight="bold">WHAT IT IS</text>
  <rect x="512" y="126" width="110" height="26" rx="4" fill="#1e1b4b" />
  <text x="526" y="144" fill="#a5b4fc" font-family="sans-serif" font-size="11" font-weight="bold">LIFETIME</text>
  <rect x="628" y="126" width="292" height="26" rx="4" fill="#1e1b4b" />
  <text x="642" y="144" fill="#a5b4fc" font-family="sans-serif" font-size="11" font-weight="bold">NOTE</text>

  <!-- row 1 ca.key -->
  <rect x="40" y="158" width="880" height="34" rx="4" fill="#1e293b" stroke="#dc2626" stroke-width="1.5" />
  <text x="54" y="180" fill="#fecaca" font-family="monospace" font-size="12">ca.key</text>
  <text x="290" y="180" fill="#e0e7ff" font-family="monospace" font-size="11">CA private key</text>
  <text x="526" y="180" fill="#34d399" font-family="monospace" font-size="11">730 days</text>
  <text x="642" y="180" fill="#f87171" font-family="sans-serif" font-size="11" font-weight="bold">the secret — generated, never committed</text>

  <!-- row 2 ca.crt -->
  <rect x="40" y="198" width="880" height="34" rx="4" fill="#1e293b" stroke="#059669" stroke-width="1.5" />
  <text x="54" y="220" fill="#a7f3d0" font-family="monospace" font-size="12">ca.crt</text>
  <text x="290" y="220" fill="#e0e7ff" font-family="monospace" font-size="11">CA certificate</text>
  <text x="526" y="220" fill="#34d399" font-family="monospace" font-size="11">730 days</text>
  <text x="642" y="220" fill="#6ee7b7" font-family="sans-serif" font-size="11">the anchor every node's fingerprint is checked</text>

  <!-- row 3 server.key -->
  <rect x="40" y="238" width="880" height="34" rx="4" fill="#1e293b" stroke="#dc2626" stroke-width="1.5" />
  <text x="54" y="260" fill="#fecaca" font-family="monospace" font-size="12">server.key</text>
  <text x="290" y="260" fill="#e0e7ff" font-family="monospace" font-size="11">leaf private key</text>
  <text x="526" y="260" fill="#fbbf24" font-family="monospace" font-size="11">2 days</text>
  <text x="642" y="260" fill="#94a3b8" font-family="sans-serif" font-size="11">mounted read-only into the registry</text>

  <!-- row 4 server.crt -->
  <rect x="40" y="278" width="880" height="34" rx="4" fill="#1e293b" stroke="#0284c7" stroke-width="1.5" />
  <text x="54" y="300" fill="#bae6fd" font-family="monospace" font-size="12">server.crt</text>
  <text x="290" y="300" fill="#e0e7ff" font-family="monospace" font-size="11">leaf certificate</text>
  <text x="526" y="300" fill="#fbbf24" font-family="monospace" font-size="11">2 days</text>
  <text x="642" y="300" fill="#94a3b8" font-family="sans-serif" font-size="11">what the registry actually presents</text>

  <!-- row 5 san.cnf -->
  <rect x="40" y="318" width="880" height="32" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1" />
  <text x="54" y="339" fill="#cbd5e1" font-family="monospace" font-size="12">san.cnf</text>
  <text x="290" y="339" fill="#e0e7ff" font-family="monospace" font-size="11">the SAN list</text>
  <text x="642" y="339" fill="#94a3b8" font-family="sans-serif" font-size="11">rendered from REGISTRY_HOST</text>

  <!-- row 6 hosts.toml -->
  <rect x="40" y="356" width="880" height="32" rx="4" fill="#1e293b" stroke="#7c3aed" stroke-width="1.5" />
  <text x="54" y="377" fill="#ddd6fe" font-family="monospace" font-size="12">hosts.toml</text>
  <text x="290" y="377" fill="#e0e7ff" font-family="monospace" font-size="11">containerd registry config</text>
  <text x="642" y="377" fill="#c4b5fd" font-family="sans-serif" font-size="11" font-weight="bold">RENDERED from containerd-hosts.toml.tmpl</text>

  <!-- row 7 byproducts -->
  <rect x="40" y="394" width="880" height="32" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1" />
  <text x="54" y="415" fill="#cbd5e1" font-family="monospace" font-size="12">ca.srl · server.csr</text>
  <text x="290" y="415" fill="#e0e7ff" font-family="monospace" font-size="11">openssl serial + CSR</text>
  <text x="642" y="415" fill="#94a3b8" font-family="sans-serif" font-size="11">byproducts of the signing chain</text>

  <!-- two clocks -->
  <rect x="40" y="444" width="430" height="56" rx="8" fill="#0f172a" stroke="#059669" />
  <text x="60" y="468" fill="#34d399" font-family="sans-serif" font-size="13" font-weight="bold">CA — 730 days</text>
  <text x="60" y="488" fill="#94a3b8" font-family="sans-serif" font-size="11">long-lived. Rotating it orphans every node at once.</text>

  <rect x="490" y="444" width="430" height="56" rx="8" fill="#0f172a" stroke="#b45309" />
  <text x="510" y="468" fill="#fbbf24" font-family="sans-serif" font-size="13" font-weight="bold">Leaf — 2 days</text>
  <text x="510" y="488" fill="#94a3b8" font-family="sans-serif" font-size="11">deliberately short. Rebuilt on every stack bring-up.</text>
</svg>